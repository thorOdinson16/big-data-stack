env {
    parallelism = 1
    job.mode = "BATCH"
}

source {
    LocalFile {
        path = "/home/abhi/seatunnel-demo/sales.csv"
        file_format_type = "csv"
        csv_use_header_line = true

        schema {
            fields {
                id = int
                customer = string
                product = string
                quantity = int
                price = double
            }
        }
    }
}

sink {
    HdfsFile {
        path = "/seatunnel-demo/sales"
        file_format_type = "csv"
        field_delimiter = ","

        fs.defaultFS = "hdfs://localhost:9000"
    }
}